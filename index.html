<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Für Google & ältere Browser (PNG 192x192) -->
  <link rel="shortcut icon" type="image/png" sizes="192x192" href="/favicon.png" />
  
  <!-- Für moderne Browser (SVG) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta name="author" content="Jonas Hasler" />
  <meta name="theme-color" content="#030014" />

  <!-- Open Graph -->
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="Jonas Hasler | Official Website" />
  <meta property="og:image" content="https://jonashasler.ch/assets/11.jpeg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="4000" />
  <meta property="og:image:height" content="6000" />
  <meta property="og:image:alt" content="Jonas Hasler competing in freestyle snowboarding" />

  <meta property="profile:first_name" content="Jonas" />
  <meta property="profile:last_name" content="Hasler" />


  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://jonashasler.ch/assets/11.jpeg" />
  <meta name="twitter:image:alt" content="Jonas Hasler competing in freestyle snowboarding" />


  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "https://jonashasler.ch/#jonas-hasler",

    "name": "Jonas Hasler",
    "birthDate": "2006-06-01",
    "url": "https://jonashasler.ch",
    "image": "https://jonashasler.ch/assets/11.jpeg",

    "jobTitle": "Professional Snowboarder",

    "description": "Swiss professional snowboarder competing in Halfpipe, Slopestyle and Big Air.",

    "nationality": {
      "@type": "Country",
      "name": "Switzerland"
    },

    "sport": "Snowboarding",

    "homeLocation": {
      "@type": "Place",
      "name": "Laax, Switzerland"
    },

    "memberOf": {
      "@type": "SportsTeam",
      "name": "Swiss Snowboard National Team",
      "sport": "Snowboarding"
    },

    "knowsAbout": [
      "Snowboarding",
      "Halfpipe",
      "Slopestyle",
      "Big Air",
      "Freestyle Snowboarding"
    ],

    "sameAs": [
      "https://www.instagram.com/jonas.hasler/",
      "https://www.fis-ski.com",
      "https://www.swiss-ski.ch"
    ]
  }
  </script>


  <!-- Structured Data: Website -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

    "@type": "WebSite",

    "name": "Jonas Hasler | Official Website",

    "alternateName": "Jonas Hasler",

    "url": "https://jonashasler.ch/",

    "author": {
      "@id": "https://jonashasler.ch/#jonas-hasler"
    },

    "description": "Official website of Swiss snowboard athlete Jonas Hasler."
  }
  </script>


</head>

<body>

  <div id="root"></div>

  <script prerender type="module" src="/src/main.tsx"></script>

</body>
</html>
